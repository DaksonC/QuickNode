name: 🧪 CI Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔏 Verify registry signatures and provenance of dependencies
        run: npm audit signatures

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🧪 Build and run tests (coverage >= 80%)
        run: npm run test:coverage

      - name: 📦 Zero runtime dependencies and no install scripts
        run: |
          node -e '
            const { dependencies = {}, scripts = {} } = require("./package.json");
            if (Object.keys(dependencies).length) { console.error("Runtime dependencies are not allowed (ADR-001):", dependencies); process.exit(1) }
            const hooks = ["preinstall", "install", "postinstall", "prepare"].filter((name) => name in scripts);
            if (hooks.length) { console.error("Lifecycle scripts run on the user machine and are not allowed (ADR-001):", hooks); process.exit(1) }
          '

      - name: 🛡️ Audit CLI dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: 📏 Package size budget (300 KB unpacked)
        run: |
          SIZE=$(npm pack --dry-run --json | node -e 'console.log(JSON.parse(require("fs").readFileSync(0))[0].unpackedSize)')
          echo "Unpacked size: $SIZE bytes"
          test "$SIZE" -le 307200

  generated-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [typescript, javascript]

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧾 Generate the ${{ matrix.template }} project, install, audit, lint, test and build it
        run: npm run test:templates
        env:
          QN_E2E_TEMPLATES: ${{ matrix.template }}
