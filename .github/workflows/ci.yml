name: 🧪 CI Tests

on:
  push:
    branches: [develop, feature/*]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🧪 Build and run tests (coverage >= 80%)
        run: npm run test:coverage

      - name: 📦 Zero runtime dependencies
        run: node -e 'const d=require("./package.json").dependencies; if (d && Object.keys(d).length) { console.error("Runtime dependencies are not allowed (ADR-001):", d); process.exit(1) }'

      - name: 🛡️ Audit CLI dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: 📏 Package size budget (300 KB unpacked)
        run: |
          SIZE=$(npm pack --dry-run --json | node -e 'console.log(JSON.parse(require("fs").readFileSync(0))[0].unpackedSize)')
          echo "Unpacked size: $SIZE bytes"
          test "$SIZE" -le 307200

  generated-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [typescript, javascript]

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 🏗️ Build CLI
        run: |
          npm ci
          npm run build

      - name: 🧾 Generate ${{ matrix.template }} project
        run: |
          mkdir -p "$RUNNER_TEMP/gen"
          cd "$RUNNER_TEMP/gen"
          node "$GITHUB_WORKSPACE/dist/cli.js" create test-project --${{ matrix.template }}
          test -f test-project/.gitignore
          test -f test-project/.env
          test ! -e test-project/package-lock.json

      - name: 📊 Install, lint, test and build generated project
        working-directory: ${{ runner.temp }}/gen/test-project
        run: |
          npm install --no-fund
          npm audit --audit-level=high
          npm run lint
          npm test
          if [ "${{ matrix.template }}" = "typescript" ]; then npm run build; fi
