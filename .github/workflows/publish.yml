name: 🚀 Publish to NPM

# The only path to the registry (ADR-001, D5): pushing a v* tag that points to a
# commit on main. npm authenticates this workflow through Trusted Publishing (OIDC),
# so there is no long-lived token, and every version carries a provenance attestation
# that links the tarball to this repository, commit and run.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout tag (with history, to check it is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: 🏷️ Tag matches package.json and points to main
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔏 Verify registry signatures and provenance of dependencies
        run: npm audit signatures

      - name: 🔍 Run linting
        run: npm run lint

      - name: 🧪 Build and run tests (coverage >= 80%)
        run: npm run test:coverage

      - name: 🛡️ Audit CLI dependencies
        run: npm audit --omit=dev --audit-level=high

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Must match the environment configured as Trusted Publisher on npmjs.com.
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token exchanged with npm; enables Trusted Publishing and provenance
    steps:
      - name: 📦 Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm 11; Trusted Publishing needs npm >= 11.5.1.
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: 🔎 npm supports Trusted Publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 is required for Trusted Publishing"); process.exit(1) }' "$(npm --version)"

      - name: 📥 Install dependencies
        run: npm ci

      # prepublishOnly builds dist/. Prereleases (1.2.3-beta.0) go to the "next" dist-tag.
      - name: 🚀 Publish with provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --provenance --access public --tag "$DIST_TAG"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: 📦 Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: 🧾 Generate SBOM (CycloneDX)
        run: |
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx --omit dev > "quicknode-cli-${GITHUB_REF_NAME}.cdx.json"

      - name: 📝 Create GitHub Release with the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "quicknode-cli-${GITHUB_REF_NAME}.cdx.json" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $PRERELEASE
          {
            echo "✅ Published @10565/quicknode-cli@${GITHUB_REF_NAME#v} with provenance"
            echo "🔗 https://www.npmjs.com/package/@10565/quicknode-cli/v/${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_STEP_SUMMARY"
